<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/cinematek_logo_512.png" />
    <!-- Macht die App am Handy installierbar ("Zum Homescreen"). Setzt HTTPS
         voraus, z. B. ueber einen Reverse-Proxy mit Zertifikat. -->
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CinematekAI" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0C" />
    <title>CinematekAI</title>
    <!-- Schriften liegen lokal unter static/fonts. Vorher wurden sie bei jedem
         Seitenaufruf von fonts.googleapis.com geholt — die einzige
         Aussenverbindung einer sonst rein lokalen App. -->
    <link rel="preload" href="%sveltekit.assets%/fonts/dm-sans-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="%sveltekit.assets%/fonts/cormorant-garamond-600-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="%sveltekit.assets%/fonts.css" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
